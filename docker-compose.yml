services:
  postgres:
    image: postgres:15-alpine
    container_name: squadsync-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: squadsync
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - squadsync-network

  redis:
    image: redis:7-alpine
    container_name: squadsync-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - squadsync-network

  backend:
    build: .
    container_name: squadsync-backend
    command: >
      sh -c "
        echo 'Starting SquadSync Backend...' &&
        python -c 'from backend.models.models import Base; from backend.models.message_models import *; from sqlalchemy.ext.asyncio import create_async_engine; import asyncio; engine = create_async_engine(\"postgresql+asyncpg://postgres:postgres@postgres:5432/squadsync\"); asyncio.run(Base.metadata.create_all(engine.sync_engine))' 2>/dev/null || true &&
        python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000
      "
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - squadsync-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: squadsync-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    networks:
      - squadsync-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  squadsync-network:
    driver: bridge
